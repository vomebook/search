name: Reader compression remote benchmark (temporary)

on:
  push:
    branches: ["bench/reader-compression-20261103"]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - name: Fetch exact benchmark sources
        run: |
          git clone --no-checkout https://huggingface.co/spaces/VoiceOfML/Search "$RUNNER_TEMP/hf-search-git"
          git -C "$RUNNER_TEMP/hf-search-git" worktree add --detach "$RUNNER_TEMP/hf-baseline" 6982e52ce18884aba1c3f068700a26b85d9717f9
          git -C "$RUNNER_TEMP/hf-search-git" worktree add --detach "$RUNNER_TEMP/hf-candidate" 6982e52ce18884aba1c3f068700a26b85d9717f9
          git -C "$RUNNER_TEMP/hf-candidate" apply --check "$GITHUB_WORKSPACE/scripts/bench/reader-compression.patch"
          git -C "$RUNNER_TEMP/hf-candidate" apply "$GITHUB_WORKSPACE/scripts/bench/reader-compression.patch"
      - name: Install pinned application dependencies
        run: python -m pip install -r "$RUNNER_TEMP/hf-candidate/requirements.txt" httpx==0.28.1
      - name: Build optional native search decoder
        run: python -B "$RUNNER_TEMP/hf-candidate/scripts/build/build_search_index_native.py" --output-dir "$RUNNER_TEMP/native"
      - name: Compare synthetic compression eligibility
        env:
          BENCH_BASELINE: ${{ runner.temp }}/hf-baseline
          BENCH_CANDIDATE: ${{ runner.temp }}/hf-candidate
          BENCH_OUTPUT: ${{ runner.temp }}/reader-compression-paired.json
          BENCH_RUN_ID: ${{ github.run_id }}
          PYTHONPATH: ${{ runner.temp }}/hf-candidate:${{ runner.temp }}/native
          PYTHONHASHSEED: "1"
        run: python -B scripts/bench/reader_compression_paired.py
      - name: Preserve detailed results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-compression-remote-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/reader-compression-paired.json
          if-no-files-found: warn
          retention-days: 14
