name: Search candidates remote benchmark (temporary)

on:
  push:
    branches: ["bench/search-candidates-stable-20261103"]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - name: Fetch exact benchmark sources
        run: |
          git clone --no-checkout https://huggingface.co/spaces/VoiceOfML/Search "$RUNNER_TEMP/hf-search-git"
          git -C "$RUNNER_TEMP/hf-search-git" worktree add --detach "$RUNNER_TEMP/hf-baseline" bc9d36d02ed278002d161f01c5512b33ed8b4ea8
          git -C "$RUNNER_TEMP/hf-search-git" worktree add --detach "$RUNNER_TEMP/hf-candidate" bc9d36d02ed278002d161f01c5512b33ed8b4ea8
          git -C "$RUNNER_TEMP/hf-candidate" apply --check "$GITHUB_WORKSPACE/scripts/bench/search-candidates-candidate.patch"
          git -C "$RUNNER_TEMP/hf-candidate" apply "$GITHUB_WORKSPACE/scripts/bench/search-candidates-candidate.patch"
      - name: Install pinned application dependencies
        run: python -m pip install -r "$RUNNER_TEMP/hf-candidate/requirements.txt" httpx==0.28.1
      - name: Build optional native search decoder
        run: python -B "$RUNNER_TEMP/hf-candidate/scripts/build/build_search_index_native.py" --output-dir "$RUNNER_TEMP/native"
      - name: Run paired synthetic search benchmarks
        env:
          BENCH_BASELINE: ${{ runner.temp }}/hf-baseline
          BENCH_CANDIDATE: ${{ runner.temp }}/hf-candidate
          BENCH_NATIVE: ${{ runner.temp }}/native
          BENCH_OUTPUT: ${{ runner.temp }}/projection-remote-benchmark.json
          BENCH_RUN_ID: ${{ github.run_id }}
        run: python -B scripts/bench/projection_remote_benchmark.py
      - name: Preserve detailed results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: search-candidates-remote-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/projection-remote-benchmark.json
          if-no-files-found: warn
          retention-days: 14
