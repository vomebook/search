# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build static site
        run: |
          mkdir -p _site/static
          cp index.html manifest.json sw.js _site/
          cp -a icons data _site/
          node scripts/fetch_reader_assets.mjs _site/data/reader_assets.json.gz
          node scripts/copy_reader_vendor.mjs _site/static/vendor
          npx --yes esbuild@0.28.2 static/app.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/app.js
          npx --yes esbuild@0.28.2 static/reader-contract.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/reader-contract.js
          npx --yes esbuild@0.28.2 static/reader-store.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/reader-store.js
          npx --yes esbuild@0.28.2 static/reader.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/reader.js
          npx --yes esbuild@0.28.2 static/index-worker.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/index-worker.js
          npx --yes esbuild@0.28.2 static/style.css --minify --outfile=_site/static/style.css
          npx --yes esbuild@0.28.2 static/reader.css --minify --outfile=_site/static/reader.css
           cp static/reader.html _site/static/reader.html
           cp static/reader-v2.html _site/static/reader-v2.html
           cp static/pdf-worker-wrapper.mjs _site/static/pdf-worker-wrapper.mjs
           cp -a static/foliate-reader _site/static/foliate-reader
           npx --yes esbuild@0.28.2 sw.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/sw.js
          node --check _site/static/app.js
          node --check _site/static/index-worker.js
          node --check _site/sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
