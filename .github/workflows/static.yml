# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # The normal build always selects a verified bucket generation. A manual
  # explicit selection permits rollback without copying old generated Git data.
  workflow_dispatch:
    inputs:
      search_generation:
        description: Optional immutable search data generation to verify and deploy
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: config/dependencies/static-check.txt
      - name: Install pinned static checkers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -r config/dependencies/static-check.txt
      - name: Check JavaScript, HTML, CSS and JavaScript types
        run: npm run check:static
      - name: Check all own Python source and tests
        run: |
          python -B scripts/check_python_static.py
          npx --no-install pyright --project pyrightconfig.strict.json
      - name: Verify static gates catch injected errors
        run: |
          python -B -m unittest -v tests.gates.test_static_shards_runner tests.gates.test_package_resolution tests.gates.test_test_inventory
          python -B scripts/check_test_inventory.py --project github
          python -B scripts/ci/run_static_gate_shards.py --project github
          python -B -m unittest -v tests.gates.test_ci_ubuntu_mirror
      - name: Verify PDF and DjVu primary document limits
        run: node tests/reader/pdf-v3/test_dataset_primary_policy.mjs
  # Single deploy job since we're just deploying
  deploy:
    needs: source-checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
      - name: Validate source JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/search/index-worker.js
          node --check static/reader.js
          node --check static/reader/pdf/reader-pdf-text.js
          node --check static/sw.js
      - name: Build static site
        env:
          SEARCH_GENERATION: ${{ inputs.search_generation || vars.SEARCH_DATA_GENERATION || 'dbf3ff87d7e5dd931fc8253fb0e69fffde9d3eade8d30dfd88af6d6d75e7e8aa' }}
        run: |
          set -euo pipefail
          mkdir -p _site/static
          cp static/index.html static/manifest.json static/sw.js _site/
          cp -a static/icons _site/icons
          # A failed or incomplete generation never falls back to stale Git data.
          node scripts/data/fetch_search_generation.mjs "$SEARCH_GENERATION" pages _site/data
          node scripts/data/fetch_reader_assets.mjs _site/data/reader_assets.json.gz
          node scripts/build/fetch_foliate_reader.mjs _site/static/foliate-reader
          node scripts/build/copy_reader_vendor.mjs _site/static/vendor --foliate-output _site/static/foliate-reader/vendor
          cp -a static/vendor/djvu-rs-reader _site/static/vendor/
          node scripts/build/compose_app.mjs > "$RUNNER_TEMP/app-composed.js"
          npx --yes esbuild@0.28.2 "$RUNNER_TEMP/app-composed.js" --minify --target=es2020 --charset=utf8 --legal-comments=none --outfile=_site/static/app.js
          for file in $(node -e 'console.log(require("./static/reader-resources.js").buildFiles("github").filter(f => f !== "app.js").join(" "))'); do
            flags=$(node -e 'console.log(require("./static/reader-resources.js").bundleArguments(process.argv[1]).join(" "))' "$file")
            npx --yes esbuild@0.28.2 "static/$file" $flags --minify --target=es2020 --charset=utf8 --legal-comments=none --outfile="_site/static/$file"
          done
          cp static/reader.html _site/static/reader.html
          npx --yes esbuild@0.28.2 static/sw.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/sw.js
          node --check _site/static/app.js
          node --check _site/static/search/index-worker.js
          node --check _site/sw.js
          node scripts/build/build_static_assets.mjs
          python3 scripts/build/seo.py --project pages --corpus _site/data/search_data.json.gz --output _site
          node scripts/build/check_reader_release.mjs --project github --root "$GITHUB_WORKSPACE" --artifact-root "$GITHUB_WORKSPACE/_site"
      - name: Cache PDF Python package downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pdf-pip-playwright-1.63.0-pypdf-6.21.4
      - name: Install PDF Python dependencies
        timeout-minutes: 10
        run: python3 -m pip install playwright==1.63.0 pypdf==6.21.4
      - name: Configure official Ubuntu mirrors
        run: |
          set -euo pipefail
          if python3 -B scripts/ci/ci_ubuntu_mirror.py; then
            tmp=$(sudo mktemp -d /etc/apt/.ci-mirrors.XXXXXX)
            trap 'sudo rm -rf -- "$tmp"' EXIT
            sudo install -o root -g root -m 0644 /dev/null "$tmp/mirrors"
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/ priority:1' 'https://security.ubuntu.com/ubuntu/ priority:2' | sudo tee "$tmp/mirrors" >/dev/null
            sudo mv -f -- "$tmp/mirrors" /etc/apt/apt-mirrors.txt
          else
            echo "::warning::Unrecognized runner mirror configuration; keeping default mirrors"
          fi
      - name: Install qpdf system dependency
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Install Playwright Chromium system libraries
        timeout-minutes: 15
        run: python3 -m playwright install-deps chromium
      - name: Identify runner distribution
        id: pdf-distro
        run: echo "version=$(. /etc/os-release; echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.pdf-distro.outputs.version }}-playwright-1.63.0-chromium
      - name: Install Playwright Chromium browser
        timeout-minutes: 15
        run: python3 -m playwright install chromium
      - name: Check content-addressed PDF opening
        timeout-minutes: 30
        run: |
          READER_BUILT_SITE="$GITHUB_WORKSPACE/_site" READER_BUILT_PROJECT=github python3 -B -m unittest -v \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_first_page_reused_and_wrong_count_corrected \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_nested_tree_first_page_does_not_wait_for_other_pages \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_incremental_linearized_preview_uses_current_first_page \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_understated_page_count_is_rebuilt_before_navigation \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_sequential_second_page_before_full_validation \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_scroll_to_second_page_before_full_validation \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_unknown_or_missing_child_never_commits_count \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_full_text_search_waits_for_verified_count \
            tests.reader.browser.test_reader_pdf_first_page.PdfFirstPageTests.test_progress_panel_cannot_add_bookmark_during_validation
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
