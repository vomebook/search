# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build static site
        run: |
          mkdir -p _site/static
          cp index.html manifest.json sw.js _site/
          cp -a icons data _site/
          npx --yes esbuild@0.25.8 static/app.js --minify-syntax --minify-whitespace --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/app.js
          npx --yes esbuild@0.25.8 static/index-worker.js --minify-syntax --minify-whitespace --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/static/index-worker.js
          npx --yes esbuild@0.25.8 static/style.css --minify --outfile=_site/static/style.css
          npx --yes esbuild@0.25.8 sw.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/sw.js
          node --check _site/static/app.js
          node --check _site/static/index-worker.js
          node --check _site/sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
