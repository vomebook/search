# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.11.1'
      - name: Validate source JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/search/index-worker.js
          node --check static/reader.js
          node --check static/reader/pdf/reader-pdf-text.js
          node --check static/sw.js
      - name: Build static site
        run: |
          mkdir -p _site/static
          cp static/index.html static/manifest.json static/sw.js _site/
          cp -a static/icons _site/icons
          cp -a data _site/
          node scripts/data/fetch_reader_assets.mjs _site/data/reader_assets.json.gz
          node scripts/build/fetch_foliate_reader.mjs _site/static/foliate-reader
          node scripts/build/copy_reader_vendor.mjs _site/static/vendor --foliate-output _site/static/foliate-reader/vendor
          cp -a static/vendor/djvu-rs-reader _site/static/vendor/
          node scripts/build/compose_app.mjs > "$RUNNER_TEMP/app-composed.js"
          npx --yes esbuild@0.28.2 "$RUNNER_TEMP/app-composed.js" --minify --target=es2020 --charset=utf8 --legal-comments=none --outfile=_site/static/app.js
          for file in $(node -e 'console.log(require("./static/reader-resources.js").buildFiles("github").filter(f => f !== "app.js").join(" "))'); do
            flags=$(node -e 'console.log(require("./static/reader-resources.js").bundleArguments(process.argv[1]).join(" "))' "$file")
            npx --yes esbuild@0.28.2 "static/$file" $flags --minify --target=es2020 --charset=utf8 --legal-comments=none --outfile="_site/static/$file"
          done
          cp static/reader.html _site/static/reader.html
          npx --yes esbuild@0.28.2 static/sw.js --minify --target=es2019 --charset=utf8 --legal-comments=none --outfile=_site/sw.js
          node --check _site/static/app.js
          node --check _site/static/search/index-worker.js
          node --check _site/sw.js
          node scripts/build/build_static_assets.mjs
          python3 scripts/build/seo.py --project pages --output _site
          node scripts/build/check_reader_release.mjs --project github --root "$GITHUB_WORKSPACE" --artifact-root "$GITHUB_WORKSPACE/_site"
      - name: Check content-addressed PDF opening
        run: |
          python3 -m pip install playwright==1.63.0 pypdf==6.14.2
          sudo apt-get update && sudo apt-get install -y qpdf
          python3 -m playwright install --with-deps chromium
          READER_BUILT_SITE="$GITHUB_WORKSPACE/_site" READER_BUILT_PROJECT=github python3 -B -m unittest -v \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_first_page_reused_and_wrong_count_corrected \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_nested_tree_first_page_does_not_wait_for_other_pages \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_incremental_linearized_preview_uses_current_first_page \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_understated_page_count_is_rebuilt_before_navigation \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_sequential_second_page_before_full_validation \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_scroll_to_second_page_before_full_validation \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_unknown_or_missing_child_never_commits_count \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_full_text_search_waits_for_verified_count \
            tests.test_reader_pdf_first_page.PdfFirstPageTests.test_progress_panel_cannot_add_bookmark_during_validation
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
