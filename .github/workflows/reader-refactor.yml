name: Reader Refactor Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: ["main"]
    paths:
      - "static/reader*.js"
      - "static/foliate-reader/**"
      - "tests/test_reader_refactor.py"
      - "tests/test_reader_chapter_search.mjs"
      - "tests/test_reader_*.py"
      - "tests/test_reader_*.mjs"
      - "requirements*.txt"
      - ".github/workflows/reader-refactor.yml"

concurrency:
  group: reader-refactor-sites
  cancel-in-progress: true

jobs:
  github-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READER_TEST_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.63.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: Run chapter-search unit tests
        run: node tests/test_reader_chapter_search.mjs
      - name: Run chapter-bundle browser gate
        run: >-
          python3 -B -m unittest -v
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_is_lazy_complete_paged_and_navigates_unloaded_repeated_hits
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_emits_partial_results_before_exact_total
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_maps_inline_nodes_entities_and_repeated_searches
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_retries_a_failed_index_and_rejects_corrupt_bytes
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_cancelled_download_cannot_publish_stale_results
      - name: Run full Reader refactor suite (informational)
        continue-on-error: true
        run: python3 -B -m unittest -v tests.test_reader_refactor
      - name: Check Reader JavaScript syntax
        run: |
          node --check static/reader.js
          node --check static/reader-chapter-search-worker.mjs

  huggingface-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READER_TEST_TIMEOUT_MS: "15000"
    steps:
      - name: Checkout Hugging Face Search Space
        run: git clone --depth=1 https://huggingface.co/spaces/VoiceOfML/Search huggingface-search
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        working-directory: huggingface-search
        run: |
          python -m pip install -r requirements.txt playwright==1.63.0 Pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: Run chapter-search unit tests
        working-directory: huggingface-search
        run: node tests/test_reader_chapter_search.mjs
      - name: Run chapter-bundle browser gate
        working-directory: huggingface-search
        run: >-
          python3 -B -m unittest -v
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_is_lazy_complete_paged_and_navigates_unloaded_repeated_hits
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_emits_partial_results_before_exact_total
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_maps_inline_nodes_entities_and_repeated_searches
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_retries_a_failed_index_and_rejects_corrupt_bytes
          tests.test_reader_refactor.ReaderRefactorTest.test_chapter_search_cancelled_download_cannot_publish_stale_results
      - name: Run full Reader refactor suite (informational)
        continue-on-error: true
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_reader_refactor
      - name: Check Reader JavaScript syntax
        working-directory: huggingface-search
        run: |
          node --check static/reader.js
          node --check static/reader-chapter-search-worker.mjs
