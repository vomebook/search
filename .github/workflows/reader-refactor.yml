name: Reader Refactor Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"

concurrency:
  group: reader-refactor-sites
  cancel-in-progress: true

jobs:
  github-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READER_TEST_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.63.0 Pillow==12.3.0 pypdf==6.21.4 -r requirements-static-check.txt
          npm ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update && sudo apt-get install -y qpdf
          python -m playwright install --with-deps chromium firefox
          node scripts/build/fetch_foliate_reader.mjs static/foliate-reader
          node scripts/build/copy_reader_vendor.mjs static/vendor --foliate-output static/foliate-reader/vendor
      - name: Check source and exercise static gates
        run: |
          npm run check:static
          npx --no-install pyright --project pyrightconfig.strict.json
          python -B scripts/check_python_static.py
          python -B -m unittest -v tests.test_static_checks tests.test_seo_catalog
      - name: Run chapter-search unit tests
        run: |
          node tests/test_reader_architecture.js
          node tests/test_reader_regression.js
          node scripts/check_adapter_coverage.mjs
          node scripts/check_search_size_coverage.mjs
          node scripts/check_search_record_path_coverage.mjs
          node scripts/check_search_highlight_coverage.mjs
          node scripts/check_search_response_cache_coverage.mjs
          node scripts/check_search_file_types_coverage.mjs
          node scripts/check_search_response_validation_coverage.mjs
          node scripts/check_search_result_identity_coverage.mjs
          node tests/test_response_cache.js
          node --test tests/test_search_extension_inventory_baseline.mjs tests/test_search_extension_filter_baseline.mjs
          node --test tests/test_search_response_validation_baseline.mjs
          node --test tests/test_search_stable_id_baseline.mjs
          node scripts/check_search_filter_equality_baseline.mjs
          node tests/test_search_record_path_build.mjs
          node tests/test_reader_preload.js
          node tests/test_reader_chapter_search.mjs
          node tests/test_reader_image_loader.mjs
          node tests/test_reader_ocr_transport.mjs
          node tests/test_reader_css_sanitizer.mjs
      - name: Run Reader request and PDF loading regressions
        run: |
          node scripts/check_request_manager_coverage.mjs
          node scripts/check_pdf_network_coverage.mjs
          node scripts/check_pdf_network_mutations.mjs
          node scripts/check_document_loader_coverage.mjs
          node tests/test_reader_pdf_first_page_worker.mjs
          python3 -B -m unittest -v tests.test_reader_pdf_first_page tests.test_reader_pdf_history_race tests.test_reader_engine_preload tests.test_reader_pdf_loading tests.test_reader_pdf_followup tests.test_reader_close_traffic tests.test_reader_navigation_host
      - name: Check staged PDF opening in Firefox
        env:
          READER_TEST_BROWSER: firefox
        run: python3 -B -m unittest -v tests.test_reader_pdf_first_page tests.test_reader_pdf_history_race
      - name: Check DjVu-only streams and image memory eviction
        run: |
          node tests/test_reader_djvu_only.mjs
          node tests/test_reader_djvu_png.mjs
          node tests/test_reader_v3_ocr_retained.mjs
          node tests/test_reader_djvu_range.mjs
          node tests/test_reader_djvu_range_fallback.mjs
          node tests/test_reader_djvu_worker.mjs
          node tests/test_reader_djvu_source_integrity.mjs
          node tests/test_reader_djvu_scheduler.mjs
          python3 -B -m unittest -v tests.test_reader_djvu_benchmark tests.test_reader_djvu_range_browser
          node tests/test_reader_image_memory.mjs
      - name: Run multi-format preparation and navigation gates
        run: python3 -B -m unittest -v tests.test_reader_format_pipeline tests.test_reader_toc_latency tests.test_reader_close_responsiveness tests.test_reader_accessibility_browser tests.test_reader_formats tests.test_reader_conversions tests.test_reader_navigation
      - name: Check TOC landing ownership and cancellation
        run: |
          node tests/test_reader_feynman_toc_reviewed.mjs
          python3 -B -m unittest -v \
            tests.test_reader_toc_navigation.TocNavigationTests.test_new_navigation_supersedes_the_previous_landing_hold \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_hold_is_cancelled_on_disposal \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_holds_while_chapters_above_keep_growing \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_releases_on_reader_scroll \
            tests.test_reader_toc_navigation.TocNavigationTests.test_merged_chm_missing_toc_anchors_use_unique_in_book_links
      - name: Run search accessibility keyboard gates
        run: python3 -B -m unittest -v tests.test_search_accessibility_browser tests.test_sidebar_keyboard tests.test_search_session_browser
      - name: Check search position persistence and pagination recovery
        run: python3 -B -m unittest -v tests.test_prefetch_pipeline tests.test_search_positions
      - name: Check random reader pools and UI responsiveness
        run: |
          node tests/test_worker_contract.js
          python3 -B -m unittest -v tests.test_converted_reader_responsiveness tests.test_browser_smoke
      - name: Check static dependency contracts
        run: node tests/test_static_contract.js
      - name: Check Firefox footer counter geometry
        env:
          SEARCH_POSITION_BROWSER: firefox
        run: python3 -B -m unittest -v tests.test_position_controls.PositionControlTests.test_footer_multi_digit_display_and_editor_do_not_overlap_total
      - name: Check warmed Reader shell reuse
        run: |
          node tests/test_service_worker.js
          python3 -B -m unittest -v tests.test_service_worker_integration.ServiceWorkerIntegrationTest.test_warmed_reader_shell_does_not_wait_for_slow_revalidation
          python3 -B -m unittest -v tests.test_service_worker_integration.ServiceWorkerIntegrationTest.test_first_install_rewarms_shell_after_delayed_controller_claim
      - name: Run Reader flow and cleanup regressions
        run: python3 -B -m unittest -v tests.test_reader_ebook_flow tests.test_reader_toc_latency
      - name: Preserve Reader local history and bookmarks
        run: |
          node tests/test_reader_store_channel.js
          python3 -B -m unittest -v tests.test_reader_store_preservation \
            tests.test_reader_performance.ReaderPerformanceTest.test_reader_store_preserves_old_history_and_keeps_current_bookmarks
          READER_STORE_TEST_BROWSER=firefox python3 -B -m unittest -v tests.test_reader_store_preservation
      - name: Run chapter-bundle browser gate
        run: |
          node scripts/check_reader_core_coverage.mjs
          python3 -B -m unittest -v tests.test_reader_scroll_anchor_browser
          python3 -B -m unittest -v tests.test_reader_optimizations
      - name: Run chapter-search browser gate
        run: python3 -B -m unittest -v -k chapter_search tests.test_reader_refactor
      - name: Run PDF theme browser gate
        run: |
          python3 -B -m unittest -v -k test_pdf_page tests.test_reader_style
          python3 -B -m unittest -v tests.test_reader_style.ReaderStyleTests.test_page_inversion_remembers_explicit_choice_and_fits_sidebar
      - name: Check compact mobile panel and high-density pages
        run: |
          python3 -B -m unittest -v \
            tests.test_reader_style.ReaderStyleTests.test_mobile_panel_is_compact_and_folder_scrolls_with_directory \
            tests.test_reader_style.ReaderStyleTests.test_mobile_folder_action_and_title_follow_breakpoint \
            tests.test_reader_style.ReaderStyleTests.test_mobile_title_and_controls_fit_all_formats \
            tests.test_reader_style.ReaderStyleTests.test_mobile_overflowing_toolbar_supports_touch_swipe \
            tests.test_reader_style.ReaderStyleTests.test_mobile_file_info_works_without_a_folder_target \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtualized_directory_accounts_for_scrolling_folder_and_search \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtualized_directory_searches_all_entries_and_clears \
            tests.test_reader_toc_navigation.TocNavigationTests.test_small_directory_search_shows_empty_state_and_resets \
            tests.test_reader_toc_navigation.TocNavigationTests.test_multiple_virtual_results_remain_after_successful_chapter_jump \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtualized_directory_search_handles_groups_replacements_and_repeated_matches \
            tests.test_reader_toc_navigation.TocNavigationTests.test_composition_end_with_unchanged_query_keeps_directory_scroll \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_toc_search_keyboard_only_navigation \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_search_renders_results_when_list_starts_at_viewport_bottom \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_search_covers_bottom_after_fractional_scroll \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_directory_filter_keeps_rendering_bounded_for_large_books \
            tests.test_reader_performance.ReaderPerformanceTest.test_late_pdf_outline_reconciles_reading_panel_without_losing_selected_tab \
            tests.test_reader_performance.ReaderPerformanceTest.test_high_density_mobile_pdf_uses_backing_scale_without_distortion
      - name: Run full Reader refactor suite
        run: python3 -B -m unittest -v tests.test_reader_refactor
      - name: Check Reader JavaScript syntax
        run: |
          node --check static/reader.js
          node --check static/reader/search/workers/reader-chapter-search-worker.mjs

  huggingface-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READER_TEST_TIMEOUT_MS: "60000"
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Hugging Face Search Space
        run: |
          git clone https://huggingface.co/spaces/VoiceOfML/Search huggingface-search
          git -C huggingface-search rev-parse HEAD
          git -C huggingface-search merge-base --is-ancestor 226c8de3747e6727b201da965fa0d139c811230a HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
      - name: Install test dependencies
        working-directory: huggingface-search
        run: |
          python -m pip install -r requirements.txt -r requirements-static-check.txt playwright==1.63.0 Pillow==12.3.0 httpx==0.28.1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source and exercise static gates
        working-directory: huggingface-search
        run: |
          npm run check:static
          npx --no-install pyright --project pyrightconfig.json
          npx --no-install pyright --project pyrightconfig.strict.json
          python -B scripts/check_python_static.py
          python -B -m unittest -v tests.test_static_checks
      - name: Verify independent Hugging Face quality baseline
        run: |
          python -B -m unittest -v tests.test_hf_quality_baseline
          mkdir -p "$RUNNER_TEMP/hf-quality-baseline"
          baseline_revision=$(python -c 'import json; print(json.load(open(".github/quality-baselines/hf-source.json"))["revision"])')
          for file in backend-coverage-debt.json strict-inventory-debt.json; do
            curl --fail --location --silent --show-error \
              "https://huggingface.co/spaces/VoiceOfML/Search/resolve/$baseline_revision/$file" \
              --output "$RUNNER_TEMP/hf-quality-baseline/$file"
          done
          python -B scripts/verify_hf_quality_baseline.py "$RUNNER_TEMP/hf-quality-baseline"
      - name: Check backend coverage and quality inventory
        working-directory: huggingface-search
        run: |
          python -B scripts/build/build_search_index_native.py --output-dir .
          python -B -m unittest -v tests.test_quality_inventory tests.test_mutation_gate_hardening tests.test_mutation_gate_main
          COVERAGE_FILE="$RUNNER_TEMP/backend-coverage" python -B -m coverage run --branch --source=backend,app -m unittest -q \
            tests.test_api_contract tests.test_cache_and_malformed tests.test_async_proxy tests.test_coverage_safety \
            tests.test_data_decoding tests.test_fastapi_endpoints tests.test_native_search_indexes tests.test_proxy_ownership tests.test_proxy_streams_contract \
            tests.test_reader_backend tests.test_reader_archive_hardening tests.test_reader_compression_safety tests.test_search_behavior tests.test_search tests.test_reader_index_warming \
            tests.test_reader_range_flights tests.test_reader_v3_catalog tests.test_search_order_cache tests.test_search_execution \
            tests.test_security tests.test_upstream_http tests.test_seo_routes tests.test_seo_catalog tests.test_reader_ocr_validation \
            tests.test_search_filters_contract tests.test_search_words_contract tests.test_mixed_folder_performance \
            tests.test_exact_search_performance tests.test_fuzzy_search_performance tests.test_data_formats_contract \
            tests.test_reader_identity_contract tests.test_cache_core_contract tests.test_reader_index_contract \
            tests.test_record_metadata_contract tests.test_folder_tree_contract tests.test_folder_tree_mutation_contract \
            tests.test_search_projection_contract tests.test_search_projection_mutation_contract \
            tests.test_search_candidates_contract tests.test_search_candidates_mutation_contract \
            tests.test_search_bootstrap_contract tests.test_search_bootstrap_mutation_contract
          COVERAGE_FILE="$RUNNER_TEMP/backend-coverage" python -B -m coverage json -o "$RUNNER_TEMP/backend-coverage.json"
          python -B scripts/check_strict_inventory.py "$RUNNER_TEMP/hf-quality-baseline/strict-inventory-debt.json"
          python -B scripts/check_backend_coverage.py "$RUNNER_TEMP/backend-coverage.json" "$RUNNER_TEMP/hf-quality-baseline/backend-coverage-debt.json"
          python -B scripts/check_search_words_mutation.py
          python -B scripts/check_search_words_mutation.py --module search_matching
          python -B scripts/check_search_words_mutation.py --module data_formats
          python -B scripts/check_search_words_mutation.py --module search_indexes
          python -B scripts/check_search_words_mutation.py --module reader_identity
          python -B scripts/check_search_words_mutation.py --module cache_core
          python -B scripts/check_search_words_mutation.py --module reader_index
          python -B scripts/check_search_words_mutation.py --module upstream_http
          python -B scripts/check_search_words_mutation.py --module search_execution
          python -B scripts/check_search_words_mutation.py --module record_metadata
          python -B scripts/check_search_words_mutation.py --module search_filters
          python -B scripts/check_search_words_mutation.py --module proxy_streams
          python -B scripts/check_search_words_mutation.py --module folder_tree
          python -B scripts/check_search_words_mutation.py --module search_projection
          python -B scripts/check_search_words_mutation.py --module search_candidates
          python -B scripts/check_search_words_mutation.py --module search_bootstrap
      - name: Install browser dependencies
        working-directory: huggingface-search
        run: python -m playwright install --with-deps chromium firefox
      - name: Install pinned Foliate runtime
        working-directory: huggingface-search
        run: node scripts/build/fetch_foliate_reader.mjs static/foliate-reader
      - name: Install pinned Reader vendors
        working-directory: huggingface-search
        run: node scripts/build/copy_reader_vendor.mjs static/vendor --foliate-output static/foliate-reader/vendor
      - name: Run chapter-search unit tests
        working-directory: huggingface-search
        run: |
          node tests/test_reader_architecture.js
          node tests/test_reader_chapter_search.mjs
          node tests/test_reader_image_loader.mjs
          node tests/test_reader_ocr_transport.mjs
          node tests/test_reader_css_sanitizer.mjs
          node tests/test_reader_heading_cache.js
          node tests/test_reader_engine_preload.js
          node tests/test_reader_regression.js
          node scripts/check_adapter_coverage.mjs
          node scripts/check_search_size_coverage.mjs
          node scripts/check_search_record_path_coverage.mjs
          node scripts/check_search_highlight_coverage.mjs
          node scripts/check_search_response_cache_coverage.mjs
          node scripts/check_search_file_types_coverage.mjs
          node scripts/check_search_response_validation_coverage.mjs
          node scripts/check_search_result_identity_coverage.mjs
          node --test tests/test_search_extension_inventory_baseline.mjs tests/test_search_extension_filter_baseline.mjs
          node --test tests/test_search_response_validation_baseline.mjs
          node --test tests/test_search_stable_id_baseline.mjs
          node scripts/check_search_filter_equality_baseline.mjs
          node tests/test_search_record_path_build.mjs
          node tests/test_reader_jxl_progressive.mjs
      - name: Run Reader request and PDF loading regressions
        working-directory: huggingface-search
        run: |
          node scripts/check_request_manager_coverage.mjs
          node scripts/check_pdf_network_coverage.mjs
          node scripts/check_pdf_network_mutations.mjs
          node scripts/check_document_loader_coverage.mjs
          node tests/test_reader_pdf_first_page_worker.mjs
          python3 -B -m unittest -v tests.test_reader_timeout
          python3 -B -m unittest -v tests.test_reader_pdf_first_page tests.test_reader_pdf_history_race tests.test_reader_engine_preload tests.test_reader_pdf_loading tests.test_reader_pdf_followup tests.test_reader_close_traffic tests.test_reader_navigation_host
      - name: Check DjVu-only streams and image memory eviction
        working-directory: huggingface-search
        run: |
          node tests/test_reader_djvu_only.mjs
          node tests/test_reader_djvu_png.mjs
          node tests/test_reader_v3_ocr_retained.mjs
          node tests/test_reader_djvu_range.mjs
          node tests/test_reader_djvu_range_fallback.mjs
          node tests/test_reader_djvu_worker.mjs
          node tests/test_reader_djvu_source_integrity.mjs
          node tests/test_reader_djvu_scheduler.mjs
          python3 -B -m unittest -v tests.test_reader_djvu_benchmark tests.test_reader_djvu_range_browser
          node tests/test_reader_image_memory.mjs
          python3 -B -m unittest -v tests.test_reader_pdf_hybrid
      - name: Run multi-format preparation and navigation gates
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_reader_format_pipeline tests.test_reader_toc_latency tests.test_reader_close_responsiveness tests.test_reader_accessibility_browser tests.test_reader_formats tests.test_reader_conversions tests.test_reader_navigation
      - name: Check TOC landing ownership and cancellation
        working-directory: huggingface-search
        run: |
          node tests/test_reader_feynman_toc_reviewed.mjs
          python3 -B -m unittest -v \
            tests.test_reader_toc_navigation.TocNavigationTests.test_new_navigation_supersedes_the_previous_landing_hold \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_hold_is_cancelled_on_disposal \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_holds_while_chapters_above_keep_growing \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_releases_on_reader_scroll
      - name: Run search accessibility keyboard gates
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_search_accessibility_browser tests.test_sidebar_keyboard tests.test_search_session_browser
      - name: Check static dependency contracts
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_static_contract
      - name: Check Firefox footer counter geometry
        working-directory: huggingface-search
        env:
          SEARCH_POSITION_BROWSER: firefox
        run: python3 -B -m unittest -v tests.test_position_controls.PositionControlTests.test_footer_multi_digit_display_and_editor_do_not_overlap_total
      - name: Run chapter-bundle browser gate
        working-directory: huggingface-search
        run: |
          node scripts/check_reader_core_coverage.mjs
          python3 -B -m unittest -v tests.test_reader_scroll_anchor_browser
          python3 -B -m unittest -v tests.test_reader_optimizations
      - name: Run chapter-search browser gate
        working-directory: huggingface-search
        run: python3 -B -m unittest -v -k chapter_search tests.test_reader_refactor
      - name: Run PDF theme browser gate
        working-directory: huggingface-search
        run: |
          python3 -B -m unittest -v -k test_pdf_page tests.test_reader_style
          python3 -B -m unittest -v tests.test_reader_style.ReaderStyleTests.test_page_inversion_remembers_explicit_choice_and_fits_sidebar
          python3 -B -m unittest -v tests.test_reader_pdf_hybrid.DirectPdfPolicyTests.test_legacy_pdf_theme_and_inversion_stay_direct_without_page_images
      - name: Check compact mobile panel and high-density pages
        working-directory: huggingface-search
        run: |
          python3 -B -m unittest -v \
            tests.test_reader_style.ReaderStyleTests.test_mobile_panel_is_compact_and_folder_scrolls_with_directory \
            tests.test_reader_style.ReaderStyleTests.test_mobile_folder_action_and_title_follow_breakpoint \
            tests.test_reader_style.ReaderStyleTests.test_mobile_title_and_controls_fit_all_formats \
            tests.test_reader_style.ReaderStyleTests.test_mobile_overflowing_toolbar_supports_touch_swipe \
            tests.test_reader_style.ReaderStyleTests.test_mobile_file_info_works_without_a_folder_target \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtualized_directory_accounts_for_scrolling_folder_and_search \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtualized_directory_searches_all_entries_and_clears \
            tests.test_reader_toc_navigation.TocNavigationTests.test_small_directory_search_shows_empty_state_and_resets \
            tests.test_reader_toc_navigation.TocNavigationTests.test_multiple_virtual_results_remain_after_successful_chapter_jump \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtualized_directory_search_handles_groups_replacements_and_repeated_matches \
            tests.test_reader_toc_navigation.TocNavigationTests.test_composition_end_with_unchanged_query_keeps_directory_scroll \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_toc_search_keyboard_only_navigation \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_search_renders_results_when_list_starts_at_viewport_bottom \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_search_covers_bottom_after_fractional_scroll \
            tests.test_reader_toc_navigation.TocNavigationTests.test_virtual_directory_filter_keeps_rendering_bounded_for_large_books \
            tests.test_reader_performance.ReaderPerformanceTest.test_late_pdf_outline_reconciles_reading_panel_without_losing_selected_tab \
            tests.test_reader_performance.ReaderPerformanceTest.test_high_density_mobile_pdf_uses_backing_scale_without_distortion
      - name: Run Reader proxy cancellation and cached-range gate
        working-directory: huggingface-search
        run: |
          timeout 120s python3 -B - <<'PY'
          import sys
          import unittest
          from backend import app
          import httpx

          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_reader_backend', 'tests.test_reader_ocr_validation',
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or not result.testsRun or result.skipped:
              sys.exit(1)
          PY
      - name: Run Reader upstream ownership gate
        working-directory: huggingface-search
        run: timeout 120s python3 -B -m unittest -v tests.test_async_proxy tests.test_reader_range_flights tests.test_proxy_ownership tests.test_proxy_streams_contract tests.test_coverage_safety tests.test_reader_index_warming tests.test_search_execution tests.test_browser.BrowserInteractionTests.test_directory_tree_preview_stays_usable_during_slow_contents tests.test_browser.BrowserInteractionTests.test_reader_back_closes_overlay_without_reloading_search
      - name: Run full Reader refactor suite
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_reader_refactor
      - name: Check Reader JavaScript syntax
        working-directory: huggingface-search
        run: |
          node --check static/reader.js
          node --check static/reader/search/workers/reader-chapter-search-worker.mjs
