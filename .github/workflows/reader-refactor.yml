name: Reader Refactor Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: ["main"]
    paths:
      - "static/app.js"
      - "static/index.html"
      - "static/style.css"
      - "static/reader*.js"
      - "static/reader*.mjs"
      - "static/reader/**"
      - "static/search/**"
      - "scripts/build/**"
      - "scripts/benchmarks/benchmark_djvu.py"
      - "scripts/benchmarks/benchmark_pdf_ranges.py"
      - "scripts/benchmarks/compare_djvu.py"
      - "static/reader*.css"
      - "static/reader*.html"
      - "static/foliate-reader/**"
      - "tests/test_reader_refactor.py"
      - "tests/test_search_accessibility_browser.py"
      - "tests/test_sidebar_keyboard.py"
      - "tests/test_paging_recovery.py"
      - "tests/test_position_controls.py"
      - "tests/test_reader_chapter_search.mjs"
      - "tests/test_reader_*.py"
      - "tests/test_reader_*.mjs"
      - "tests/test_reader_*.js"
      - "tests/reader_native_fixture.py"
      - "tests/reader_test_selection.py"
      - "tests/fixtures/synthetic-reader.djvu"
      - "tests/fixtures/synthetic-reader-NOTICE.txt"
      - "tests/fixtures/synthetic-djvu-benchmark.djvu"
      - "tests/fixtures/synthetic-djvu-benchmark-NOTICE.txt"
      - "tests/fixtures/issue8088.pdf"
      - "tests/fixtures/issue8088-NOTICE.txt"
      - "tests/fixtures/pdfjs-LICENSE.txt"
      - "requirements*.txt"
      - ".github/workflows/reader-refactor.yml"

concurrency:
  group: reader-refactor-sites
  cancel-in-progress: true

jobs:
  github-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READER_TEST_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.63.0 Pillow==12.3.0 pypdf==6.14.2
          sudo apt-get update && sudo apt-get install -y qpdf
          python -m playwright install --with-deps chromium firefox
          node scripts/build/fetch_foliate_reader.mjs static/foliate-reader
          node scripts/build/copy_reader_vendor.mjs static/vendor --foliate-output static/foliate-reader/vendor
      - name: Run chapter-search unit tests
        run: |
          node tests/test_reader_architecture.js
          node tests/test_reader_chapter_search.mjs
          node tests/test_reader_ocr_transport.mjs
          node tests/test_reader_css_sanitizer.mjs
      - name: Run Reader request and PDF loading regressions
        run: |
          node tests/test_reader_request_manager.js
          node tests/test_reader_pdf_sparse_ranges.mjs
          node tests/test_reader_pdf_first_page_worker.mjs
          python3 -B -m unittest -v tests.test_reader_pdf_first_page tests.test_reader_pdf_loading tests.test_reader_pdf_followup tests.test_reader_close_traffic tests.test_reader_navigation_host
      - name: Check staged PDF opening in Firefox
        env:
          READER_TEST_BROWSER: firefox
        run: python3 -B -m unittest -v tests.test_reader_pdf_first_page
      - name: Check DjVu-only streams and image memory eviction
        run: |
          node tests/test_reader_djvu_only.mjs
          node tests/test_reader_djvu_png.mjs
          node tests/test_reader_djvu_range.mjs
          node tests/test_reader_djvu_range_fallback.mjs
          node tests/test_reader_djvu_worker.mjs
          node tests/test_reader_djvu_source_integrity.mjs
          node tests/test_reader_djvu_scheduler.mjs
          python3 -B -m unittest -v tests.test_reader_djvu_benchmark tests.test_reader_djvu_range_browser
          node tests/test_reader_image_memory.mjs
      - name: Run multi-format preparation and navigation gates
        run: python3 -B -m unittest -v tests.test_reader_format_pipeline tests.test_reader_toc_latency tests.test_reader_accessibility_browser tests.test_reader_formats tests.test_reader_conversions tests.test_reader_navigation
      - name: Check TOC landing ownership and cancellation
        run: |
          node tests/test_reader_feynman_toc_reviewed.mjs
          python3 -B -m unittest -v \
            tests.test_reader_toc_navigation.TocNavigationTests.test_new_navigation_supersedes_the_previous_landing_hold \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_hold_is_cancelled_on_disposal \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_holds_while_chapters_above_keep_growing \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_releases_on_reader_scroll \
            tests.test_reader_toc_navigation.TocNavigationTests.test_merged_chm_missing_toc_anchors_use_unique_in_book_links
      - name: Run search accessibility keyboard gates
        run: python3 -B -m unittest -v tests.test_search_accessibility_browser tests.test_sidebar_keyboard
      - name: Check Firefox footer counter geometry
        env:
          SEARCH_POSITION_BROWSER: firefox
        run: python3 -B -m unittest -v tests.test_position_controls.PositionControlTests.test_footer_multi_digit_display_and_editor_do_not_overlap_total
      - name: Check warmed Reader shell reuse
        run: |
          node tests/test_service_worker.js
          python3 -B -m unittest -v tests.test_service_worker_integration.ServiceWorkerIntegrationTest.test_warmed_reader_shell_does_not_wait_for_slow_revalidation
          python3 -B -m unittest -v tests.test_service_worker_integration.ServiceWorkerIntegrationTest.test_first_install_rewarms_shell_after_delayed_controller_claim
      - name: Run Reader flow and cleanup regressions
        run: python3 -B -m unittest -v tests.test_reader_ebook_flow tests.test_reader_toc_latency
      - name: Run chapter-bundle browser gate
        run: |
          node tests/test_reader_chapter_scheduler.js
          node tests/test_reader_chapter_preload.js
          python3 -B -m unittest -v tests.test_reader_optimizations
      - name: Run chapter-search browser gate
        run: python3 -B -m unittest -v -k chapter_search tests.test_reader_refactor
      - name: Run PDF theme browser gate
        run: |
          python3 -B -m unittest -v -k test_pdf_page tests.test_reader_style
          python3 -B -m unittest -v tests.test_reader_style.ReaderStyleTests.test_page_inversion_remembers_explicit_choice_and_fits_sidebar
      - name: Run full Reader refactor suite
        run: python3 -B -m unittest -v tests.test_reader_refactor
      - name: Check Reader JavaScript syntax
        run: |
          node --check static/reader.js
          node --check static/reader/search/workers/reader-chapter-search-worker.mjs

  huggingface-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READER_TEST_TIMEOUT_MS: "60000"
    steps:
      - name: Checkout Hugging Face Search Space
        run: git clone --depth=1 https://huggingface.co/spaces/VoiceOfML/Search huggingface-search
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
      - name: Install test dependencies
        working-directory: huggingface-search
        run: python -m pip install -r requirements.txt playwright==1.63.0 Pillow==12.3.0 httpx==0.28.1
      - name: Install browser dependencies
        working-directory: huggingface-search
        run: python -m playwright install --with-deps chromium firefox
      - name: Install pinned Foliate runtime
        working-directory: huggingface-search
        run: node scripts/build/fetch_foliate_reader.mjs static/foliate-reader
      - name: Install pinned Reader vendors
        working-directory: huggingface-search
        run: node scripts/build/copy_reader_vendor.mjs static/vendor --foliate-output static/foliate-reader/vendor
      - name: Run chapter-search unit tests
        working-directory: huggingface-search
        run: |
          node tests/test_reader_architecture.js
          node tests/test_reader_chapter_search.mjs
          node tests/test_reader_ocr_transport.mjs
          node tests/test_reader_css_sanitizer.mjs
          node tests/test_reader_heading_cache.js
          node tests/test_reader_engine_preload.js
          node tests/test_reader_regression.js
      - name: Run Reader request and PDF loading regressions
        working-directory: huggingface-search
        run: |
          node tests/test_reader_request_manager.js
          node tests/test_reader_initial_recovery.js
          node tests/test_reader_pdf_range_transport.mjs
          node tests/test_reader_pdf_first_page_worker.mjs
          python3 -B -m unittest -v tests.test_reader_timeout
          python3 -B -m unittest -v tests.test_reader_pdf_first_page tests.test_reader_pdf_loading tests.test_reader_pdf_followup tests.test_reader_close_traffic tests.test_reader_navigation_host
      - name: Check DjVu-only streams and image memory eviction
        working-directory: huggingface-search
        run: |
          node tests/test_reader_djvu_only.mjs
          node tests/test_reader_djvu_png.mjs
          node tests/test_reader_djvu_range.mjs
          node tests/test_reader_djvu_range_fallback.mjs
          node tests/test_reader_djvu_worker.mjs
          node tests/test_reader_djvu_source_integrity.mjs
          node tests/test_reader_djvu_scheduler.mjs
          python3 -B -m unittest -v tests.test_reader_djvu_benchmark tests.test_reader_djvu_range_browser
          node tests/test_reader_image_memory.mjs
          python3 -B -m unittest -v tests.test_reader_pdf_hybrid
      - name: Run multi-format preparation and navigation gates
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_reader_format_pipeline tests.test_reader_toc_latency tests.test_reader_accessibility_browser tests.test_reader_formats tests.test_reader_conversions tests.test_reader_navigation
      - name: Check TOC landing ownership and cancellation
        working-directory: huggingface-search
        run: |
          node tests/test_reader_feynman_toc_reviewed.mjs
          python3 -B -m unittest -v \
            tests.test_reader_toc_navigation.TocNavigationTests.test_new_navigation_supersedes_the_previous_landing_hold \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_hold_is_cancelled_on_disposal \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_holds_while_chapters_above_keep_growing \
            tests.test_reader_toc_navigation.TocNavigationTests.test_landing_releases_on_reader_scroll
      - name: Run search accessibility keyboard gates
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_search_accessibility_browser tests.test_sidebar_keyboard
      - name: Check Firefox footer counter geometry
        working-directory: huggingface-search
        env:
          SEARCH_POSITION_BROWSER: firefox
        run: python3 -B -m unittest -v tests.test_position_controls.PositionControlTests.test_footer_multi_digit_display_and_editor_do_not_overlap_total
      - name: Run chapter-bundle browser gate
        working-directory: huggingface-search
        run: |
          node tests/test_reader_chapter_scheduler.js
          node tests/test_reader_chapter_preload.js
          python3 -B -m unittest -v tests.test_reader_optimizations
      - name: Run chapter-search browser gate
        working-directory: huggingface-search
        run: python3 -B -m unittest -v -k chapter_search tests.test_reader_refactor
      - name: Run PDF theme browser gate
        working-directory: huggingface-search
        run: |
          python3 -B -m unittest -v -k test_pdf_page tests.test_reader_style
          python3 -B -m unittest -v tests.test_reader_style.ReaderStyleTests.test_page_inversion_remembers_explicit_choice_and_fits_sidebar
          python3 -B -m unittest -v tests.test_reader_pdf_hybrid.DirectPdfPolicyTests.test_legacy_pdf_theme_and_inversion_stay_direct_without_page_images
      - name: Run Reader proxy cancellation and cached-range gate
        working-directory: huggingface-search
        run: |
          timeout 120s python3 -B - <<'PY'
          import sys
          import unittest
          from backend import app
          import httpx

          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_reader_backend')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or not result.testsRun or result.skipped:
              sys.exit(1)
          PY
      - name: Run Reader upstream ownership gate
        working-directory: huggingface-search
        run: timeout 120s python3 -B -m unittest -v tests.test_async_proxy tests.test_reader_range_flights tests.test_proxy_ownership
      - name: Run full Reader refactor suite
        working-directory: huggingface-search
        run: python3 -B -m unittest -v tests.test_reader_refactor
      - name: Check Reader JavaScript syntax
        working-directory: huggingface-search
        run: |
          node --check static/reader.js
          node --check static/reader/search/workers/reader-chapter-search-worker.mjs
