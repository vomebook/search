<header class="reader-toolbar"><button id="back" class="icon-button" type="button">&#8592;</button><div class="reader-heading"><strong id="title">在线阅读</strong><button id="reader-path" class="reader-path" type="button" hidden></button><span id="status">正在准备...</span></div><div class="reader-actions"><span class="control-group page-controls"><button id="page-prev" class="icon-button" type="button">&#8249;</button><label class="compact-input"><input id="page-number" type="number" min="1" value="1"><span id="page-total">/ -</span></label><button id="page-next" class="icon-button" type="button">&#8250;</button></span><span class="control-group zoom-controls"><button id="zoom-out" class="icon-button" type="button">&#8722;</button><label class="compact-input"><input id="zoom" type="number" min="25" max="400" step="10" value="100"><span>%</span></label><button id="zoom-in" class="icon-button" type="button">+</button></span><a id="ocr" class="text-button" target="_blank" hidden>OCR</a><a id="download" class="icon-button" target="_blank" rel="noopener noreferrer">&#8681;</a></div><button id="history" class="icon-button" type="button">&#9776;</button></header>

<script>(function(){const p=document.querySelector("#bookmark-popover");if(p){p.className="bookmark-popover";p.setAttribute("role","dialog");p.setAttribute("aria-modal","true")}for(const panel of document.querySelectorAll(".reader-panel-view")){const header=panel.querySelector(".panel-view-header"),target=panel.id==="history-view"?(header.querySelector("span")||header):header;if(target&&!target.querySelector(".panel-search-toggle")){const b=document.createElement("button");b.className="panel-search-toggle";target.appendChild(b)}if(panel.querySelector(".panel-list")&&!panel.querySelector(".panel-search")){const i=document.createElement("input");i.className="panel-search";i.hidden=true;panel.insertBefore(i,panel.querySelector(".panel-list"))}}})();</script>
<script type="module" src="/search/static/reader.js?reader-v1"></script><script>(function(){setTimeout(function(){const b=document.querySelector("#theme-toggle"),h=document.querySelector("#history-panel > header"),x=document.querySelector("#history-close"),r=document.querySelector("#reader-path"),s=document.querySelector("#status"),p=new URLSearchParams(location.search),e=(p.get("ext")||"").toLowerCase();if(b&&h&&x)h.insertBefore(b,x);if(b){b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'}if(s)s.hidden=true;if(r){r.textContent=p.get("path")||"";r.hidden=!r.textContent}const t=document.querySelector("#title");if(t&&e&&!t.textContent.toLowerCase().endsWith("."+e))t.textContent+="."+e},100)},0)})();</script>
<script>(function(){const id=new URLSearchParams(location.search).get("id");if(id)fetch("https://voiceofml-search.hf.space/api/reader-resolve?id="+encodeURIComponent(id)).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.title)return;const e=(d.original_extension||d.extension||"").toLowerCase(),t=document.querySelector("#title");if(t)t.textContent=d.title+(e&&!d.title.toLowerCase().endsWith("."+e)?"."+e:"")}).catch(()=>{})})();</script>
<script>(function(){const id=new URLSearchParams(location.search).get("id");if(id)fetch("https://voiceofml-search.hf.space/api/reader-resolve?id="+encodeURIComponent(id)).then(r=>r.ok?r.json():null).then(d=>{const t=document.querySelector("#title"),e=(d&&d.original_extension||"").toLowerCase();if(t&&d&&d.title)t.textContent=d.title+(e&&!d.title.toLowerCase().endsWith("."+e)?"."+e:"")}).catch(()=>{})})();</script>
