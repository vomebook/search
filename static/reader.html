<script>(function(){const p=document.querySelector("#bookmark-popover");if(p){p.className="bookmark-popover";p.setAttribute("role","dialog");p.setAttribute("aria-modal","true")}for(const panel of document.querySelectorAll(".reader-panel-view")){const header=panel.querySelector(".panel-view-header");if(header&&!header.querySelector(".panel-search-toggle")){const b=document.createElement("button");b.className="panel-search-toggle";header.appendChild(b)}if(panel.querySelector(".panel-list")&&!panel.querySelector(".panel-search")){const i=document.createElement("input");i.className="panel-search";i.hidden=true;panel.insertBefore(i,panel.querySelector(".panel-list"))}}})();</script>
