<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceOfML Reader</title>
<link rel="stylesheet" href="/search/static/reader.css">
<script defer src="/search/static/reader-contract.js"></script>
<script defer src="/search/static/reader-store.js"></script>
</head>
<body>
<header class="reader-toolbar"><button id="back" class="icon-button" type="button">&#8592;</button><div class="reader-heading"><strong id="title">在线阅读</strong><button id="reader-path" class="reader-path" type="button" hidden></button><span id="status">正在准备...</span></div><div class="reader-actions"><span class="control-group page-controls"><button id="page-prev" class="icon-button" type="button">&#8249;</button><label class="compact-input"><input id="page-number" type="number" min="1" value="1"><span id="page-total">/ -</span></label><button id="page-next" class="icon-button" type="button">&#8250;</button></span><span class="control-group zoom-controls"><button id="zoom-out" class="icon-button" type="button">&#8722;</button><label class="compact-input"><input id="zoom" type="number" min="25" max="400" step="10" value="100"><span>%</span></label><button id="zoom-in" class="icon-button" type="button">+</button></span><a id="ocr" class="text-button" target="_blank" hidden>OCR</a><a id="download" class="icon-button" target="_blank">&#8681;</a></div><button id="history" class="icon-button" type="button">&#9776;</button></header>
<main id="viewport" class="reader-viewport"><button id="bookmark-ribbon" class="bookmark-ribbon" type="button"></button><div id="bookmark-popover" hidden><span id="bookmark-prompt"></span><div><button id="bookmark-add" type="button">添加书签</button><button id="bookmark-cancel" type="button">取消</button></div></div><div id="loading-status" role="status">正在加载原文件...</div><div id="content" class="reader-content"></div></main>
<aside id="history-panel" class="reader-panel" hidden><header><strong>阅读选项</strong><button id="history-close" class="icon-button" type="button">&times;</button></header><nav class="reader-panel-tabs"><button id="toc-tab" data-panel="toc" hidden>目录</button><button id="bookmarks-tab" data-panel="bookmarks">书签</button><button id="history-tab" data-panel="history">历史</button></nav><section id="toc-panel" class="reader-panel-view" data-panel-view="toc" hidden><div class="panel-view-header"><strong>目录</strong></div><div id="toc-list" class="panel-list"></div></section><section id="bookmarks-panel" class="reader-panel-view" data-panel-view="bookmarks" hidden><div class="panel-view-header"><strong>书签</strong></div><div id="bookmarks-list" class="panel-list"></div></section><section id="history-view" class="reader-panel-view" data-panel-view="history" hidden><div class="panel-view-header"><strong>阅读历史</strong></div><div id="history-list" class="panel-list"></div></section><footer><button id="theme-toggle" type="button">切换主题</button></footer></aside>
<script type="module" src="/search/static/reader.js?v=foliate-only-v1"></script>
</body></html>
